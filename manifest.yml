modules:
  jira:customFieldType:
    - key: traffic-light-field
      name: Traffic Light
      description: A custom field representing a traffic light status.
      type: string
      edit:
        resource: edit
        experience:
          - issue-create
          - issue-transition
          - issue-view
          - portal-request
      defaultValue: "⚪️⚪️⚪️"
resources:
  - key: edit
    path: static/edit/build
permissions:
  content:
    styles:
      - unsafe-inline
app:
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/c9c82fcd-562e-4b90-8326-1fda48868da8
